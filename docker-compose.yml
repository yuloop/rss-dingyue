version: '3.8'

services:
  rss-dingyue:
    build: .
    container_name: rss-dingyue
    restart: unless-stopped
    ports:
      - "1471:1471"
    volumes:
      - ./data:/app/data
    environment:
      - PORT=1471
      - DATA_DIR=/app/data
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:1471/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
